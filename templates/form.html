<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Form</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="form-container">

        <!-- Header -->
        <div class="header-row">
            <div>
                <h2 id="formTitle">Dynamic Form</h2>
                <div id="formMeta" class="subtle"></div>
            </div>

            <div class="header-actions">
                <a href="/admin" class="link">Admin</a>
            </div>
        </div>

        <!-- Config selector -->
        <div class="config-row">
            <label for="configSelect">Select Form Version:</label>
            <select id="configSelect"></select>
        </div>

        <!-- Dynamic form -->
        <form id="dynamicForm"></form>

        <!-- Message -->
        <p id="message"></p>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
